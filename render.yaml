services:
  # Required secrets (set in Render dashboard, not in this file):
  # - ATLAS_TREASURY_KEYPAIR: JSON array treasury keypair for token sale and faucet
  # - GOVERNANCE_KEYPAIR: JSON array governance keypair for circuit breaker
  # - ORACLE_KEYPAIR: JSON array oracle signer keypair
  # - HELIUS_API_KEY: Helius API key for webhooks
  # - HELIUS_WEBHOOK_SECRET: Webhook signature secret
  - type: postgres
    name: atlas-protocol-db
    databaseName: atlas
    user: atlas
    password: "${POSTGRES_PASSWORD}"

  - type: web
    name: atlas-protocol-backend
    runtime: docker
    port: 10000
    envVars:
      - key: NODE_ENV
        value: production
      - key: REPOSITORY_DRIVER
        value: postgres
      - key: DB_AUTO_MIGRATE
        value: "true"
      - key: DB_AUTO_SEED
        value: "true"
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: CORS_ORIGINS
        value: https://atlas-protocol-frontend.vercel.app
      - key: DATABASE_URL
        fromService:
          type: postgres
          name: atlas-protocol-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: BACKEND_PORT
        value: 10000
    deploy:
      numInstances: 1
