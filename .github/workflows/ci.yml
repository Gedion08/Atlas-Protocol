name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter atlas-frontend lint
      - run: pnpm --filter atlas-frontend typecheck
      - run: pnpm --filter atlas-frontend test
      - run: pnpm --filter atlas-frontend build

  backend:
    name: Backend (typecheck, test with coverage, build, migrate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter atlas-types build
      - run: pnpm --filter atlas-backend typecheck
      - run: pnpm --filter atlas-backend test:coverage
      - run: pnpm --filter atlas-backend build
      - name: Verify migrations
        run: >-
          DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas
          pnpm --filter atlas-backend db:migrate

  programs:
    name: Solana programs (clippy, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend
          push: false
