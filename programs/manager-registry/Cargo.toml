[package]
name = "atlas-manager-registry"
version = "0.1.0"
description = "Atlas Protocol LP manager registry and reputation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
atlas-staking = { path = "../staking", features = ["cpi"] }

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "solana"))', 'cfg(target_os, values("solana"))'] }
