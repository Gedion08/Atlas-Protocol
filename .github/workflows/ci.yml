name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter atlas-frontend lint
      - run: pnpm --filter atlas-frontend typecheck
      - run: pnpm --filter atlas-frontend test
      - run: pnpm --filter atlas-frontend build

  backend:
    name: Backend (typecheck, test with coverage, build, migrate)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter atlas-types build
      - run: pnpm --filter atlas-backend lint
      - run: pnpm --filter atlas-backend typecheck
      - run: pnpm --filter atlas-backend test:coverage
      - run: pnpm --filter atlas-backend build
      - name: Verify migrations
        run: >-
          DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas
          pnpm --filter atlas-backend db:migrate
      - name: Postgres repository integration tests
        run: >-
          DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas
          pnpm --filter atlas-backend test:integration

  programs:
    name: Solana programs (clippy, test, build, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked
      - run: anchor build
      - run: |
          for prog in atlas_vault atlas_manager_registry atlas_staking atlas_governance atlas_treasury; do
            if [ ! -d "target/types/${prog}" ]; then
              echo "::error::Missing target/types/${prog}"
              exit 1
            fi
          done
      - name: Verify Anchor TypeScript tests compile
        run: |
          cd programs
          for test in vault/tests/vault.ts manager-registry/tests/*.ts staking/tests/*.ts governance/tests/*.ts treasury/tests/*.ts; do
            if [ -f "$test" ]; then
              npx tsc --noEmit --esModuleInterop --module commonjs --moduleResolution node --target ES2020 --skipLibCheck "$test" 2>&1 || echo "::warning::Compile check failed for $test"
            fi
          done

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
